<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline · Tunebox</title>
    <meta name="theme-color" content="#121212" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <style>
      :root {
        color-scheme: dark light;
        --bg: #121212;
        --fg: #f5f5f5;
        --muted: #aaa;
        --accent: #1ed760;
        --accent-fg: #0c0c0c;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #f7f7f5;
          --fg: #161616;
          --muted: #60605c;
          --accent: #0e7033;
          --accent-fg: #ffffff;
        }
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--fg);
        font:
          16px/1.5 system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        padding: 24px;
        box-sizing: border-box;
      }
      main {
        max-width: 26rem;
        text-align: center;
      }
      img {
        width: 72px;
        height: 72px;
      }
      h1 {
        font-size: 1.5rem;
        margin: 16px 0 8px;
      }
      p {
        color: var(--muted);
        margin: 0 0 8px;
      }
      a,
      button {
        display: inline-block;
        margin-top: 16px;
        padding: 10px 20px;
        border-radius: 999px;
        border: 0;
        background: var(--accent);
        color: var(--accent-fg);
        font: inherit;
        font-weight: 700;
        text-decoration: none;
        cursor: pointer;
      }
      a:focus-visible,
      button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon.svg" alt="" />
      <h1 data-t="title">You're offline</h1>
      <p data-t="page">This page isn't available offline.</p>
      <p data-t="library">
        Your library, playlists and every song you've imported still work offline. Open Tunebox's
        home screen to keep listening.
      </p>
      <a href="/songs" data-t="open">Open my library</a>
      <br />
      <button type="button" onclick="location.reload()" data-t="retry">Try again</button>
    </main>
    <script>
      // Same language choice as the app: the saved setting, else the browser's language.
      try {
        var pref = localStorage.getItem('tunebox-language') || 'auto';
        var langs = navigator.languages || [navigator.language];
        var auto = 'en';
        for (var i = 0; i < langs.length; i++) {
          var base = String(langs[i]).slice(0, 2).toLowerCase();
          if (base === 'fr' || base === 'en') {
            auto = base;
            break;
          }
        }
        var fr = pref === 'fr' || (pref === 'auto' && auto === 'fr');
        if (fr) {
          document.documentElement.lang = 'fr';
          document.title = 'Hors ligne · Tunebox';
          var text = {
            title: 'Vous êtes hors ligne',
            page: 'Cette page n’est pas disponible hors ligne.',
            library:
              'Votre bibliothèque, vos playlists et tous les titres importés fonctionnent toujours hors ligne. Ouvrez l’écran d’accueil de Tunebox pour continuer l’écoute.',
            open: 'Ouvrir ma bibliothèque',
            retry: 'Réessayer',
          };
          document.querySelectorAll('[data-t]').forEach(function (el) {
            el.textContent = text[el.getAttribute('data-t')];
          });
        }
      } catch (e) {
        /* stays in English */
      }
    </script>
  </body>
</html>
