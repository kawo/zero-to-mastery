<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Tunebox</title>
    <meta
      name="description"
      content="Your offline music library. Import MP3s, build playlists, play anywhere."
    />
    <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <script>
      // Apply the saved theme, contrast and language before first paint to avoid a flash.
      try {
        var root = document.documentElement;
        var t = localStorage.getItem('tunebox-theme') || 'system';
        var dark =
          t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        root.classList.toggle('dark', dark);
        var c = localStorage.getItem('tunebox-contrast') || 'system';
        root.classList.toggle(
          'hc',
          c === 'high' || (c === 'system' && matchMedia('(prefers-contrast: more)').matches),
        );
        var l = localStorage.getItem('tunebox-language') || 'auto';
        if (l === 'auto') {
          var langs = navigator.languages || [navigator.language];
          l = 'en';
          for (var i = 0; i < langs.length; i++) {
            var base = String(langs[i]).slice(0, 2).toLowerCase();
            if (base === 'fr' || base === 'en') {
              l = base;
              break;
            }
          }
        }
        root.lang = l;
      } catch (e) {
        document.documentElement.classList.add('dark');
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript
      >Tunebox needs JavaScript to play your music. / Tunebox a besoin de JavaScript pour lire votre
      musique.</noscript
    >
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
