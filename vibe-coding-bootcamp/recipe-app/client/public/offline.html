<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline · Recipes</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!--
      Shown by the service worker only when a page is requested offline and
      the app shell itself isn't cached yet (e.g. the very first visit was
      interrupted). Self-contained: no external CSS, JS or fonts.
    -->
    <style>
      :root { color-scheme: light dark; --bg: #fafaf9; --fg: #1c1917; --muted: #57534e; --accent: #ea580c; }
      @media (prefers-color-scheme: dark) { :root { --bg: #1c1917; --fg: #f5f5f4; --muted: #a8a29e; --accent: #fb923c; } }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
             font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--fg); }
      main { max-width: 28rem; text-align: center; }
      svg { width: 64px; height: 64px; color: var(--accent); }
      h1 { font-size: 1.5rem; margin: 16px 0 8px; }
      p { color: var(--muted); line-height: 1.5; margin: 0 0 20px; }
      button { font: inherit; padding: 10px 18px; border-radius: 8px; border: 0; background: var(--accent); color: #fff; cursor: pointer; }
      button:focus-visible { outline: 3px solid var(--fg); outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 20h.01"/><path d="M8.5 16.43a5 5 0 0 1 7 0"/><path d="M2 8.82a15 15 0 0 1 4.17-2.65"/>
        <path d="M10.66 5c4.01-.36 8.14.9 11.34 3.76"/><path d="M16.85 11.25a10 10 0 0 1 2.22 1.68"/>
        <path d="M5 12.86a10 10 0 0 1 5.17-2.69"/><path d="m2 2 20 20"/>
      </svg>
      <h1>You're offline</h1>
      <p>This page hasn't been saved for offline use yet. Reconnect and try again. Once the app has loaded online, your favorites open offline too.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
