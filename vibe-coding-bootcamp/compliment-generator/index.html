<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Compliment Generator</title>
  <meta name="description" content="A little dose of kindness: get a random compliment with one click." />

  <!-- Tab icon -->
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png" />

  <!-- Link previews (Facebook, WhatsApp, X, Slack…). Facebook reads these tags
       itself: it doesn't run JavaScript, so they have to be written here. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Compliment Generator" />
  <meta property="og:title" content="Compliment Generator" />
  <meta property="og:description" content="A little dose of kindness: a random compliment or joke with one click. 100 compliments and 100 jokes, in English and French." />
  <meta property="og:locale" content="en_GB" />
  <meta property="og:locale:alternate" content="fr_FR" />
  <meta name="twitter:card" content="summary_large_image" />
  <!-- Once the site is online, uncomment these two lines and put the site's full
       address in them (Facebook only accepts absolute URLs for these):
  <meta property="og:url" content="https://YOUR-SITE/compliment-generator/" />
  <meta property="og:image" content="https://YOUR-SITE/compliment-generator/images/og-image.png" />
  -->
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Compliment Generator: 100 compliments and 100 jokes" />

  <!-- Google Fonts: Nunito for the compliment, Lato for the button and UI text -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Nunito:wght@600;800&display=swap" rel="stylesheet" />

  <!-- Styles -->
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- Decorative background: soft colour glows and small shapes floating up.
       Purely visual, so it's hidden from screen readers. -->
  <div class="backdrop" aria-hidden="true">
    <div class="glow glow-coral"></div>
    <div class="glow glow-yellow"></div>
    <div class="glow glow-peach"></div>
    <div class="glow glow-pink"></div>
    <span class="float bubble"></span>
    <span class="float ring"></span>
    <span class="float sparkle"></span>
    <span class="float bubble"></span>
    <span class="float ring"></span>
    <span class="float sparkle"></span>
    <span class="float bubble"></span>
    <span class="float ring"></span>
    <span class="float sparkle"></span>
    <span class="float bubble"></span>
    <span class="float ring"></span>
    <span class="float sparkle"></span>
  </div>

  <main class="page">
    <!-- The card that holds the compliment and the button -->
    <section class="card" aria-labelledby="card-title">
      <!-- Language switch. Each option is written in its own language so it's
           recognisable whatever language the page is in. -->
      <div class="card-top">
        <!-- Actions on the compliment or joke on screen: favorite, copy, share -->
        <div class="card-actions">
          <button type="button" class="card-icon fav-toggle" id="fav-toggle" aria-pressed="false" aria-label="Add to favorites" title="Add to favorites">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
              <path d="M12 20.5s-7.5-4.6-9.3-9.2C1.4 8 3.6 4.5 7.1 4.5c2 0 3.6 1.1 4.9 2.8 1.3-1.7 2.9-2.8 4.9-2.8 3.5 0 5.7 3.5 4.4 6.8-1.8 4.6-9.3 9.2-9.3 9.2Z" />
            </svg>
          </button>

          <!-- Copy: the check mark replaces the copy icon for a moment after copying -->
          <button type="button" class="card-icon copy-button" id="copy-button" aria-label="Copy to clipboard" title="Copy to clipboard">
            <svg class="icon-copy" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
              <rect x="8.5" y="8.5" width="11" height="11" rx="2.5" />
              <path d="M15.5 8.5V6.5a2 2 0 0 0-2-2h-7a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h2" />
            </svg>
            <svg class="icon-check" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
              <path d="M5 12.5l4.5 4.5L19 7.5" />
            </svg>
          </button>

          <!-- Share: the device's share sheet when available, otherwise the menu below -->
          <button type="button" class="card-icon share-button" id="share-button" aria-label="Share" title="Share" aria-haspopup="true" aria-expanded="false" aria-controls="share-menu">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
              <path d="M12 15V4M7.5 8.5 12 4l4.5 4.5" />
              <path d="M8 11H6.5a2 2 0 0 0-2 2v5.5a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V13a2 2 0 0 0-2-2H16" />
            </svg>
          </button>

          <div class="share-menu" id="share-menu" hidden>
            <p class="share-menu-title" id="share-menu-title">Share on</p>
            <ul class="share-links" id="share-links" aria-labelledby="share-menu-title"></ul>
          </div>
        </div>

        <div class="lang-switch" role="group" aria-label="Language" id="lang-switch">
          <button type="button" class="lang-option" data-lang="en" lang="en" aria-label="English" aria-pressed="true">EN</button>
          <button type="button" class="lang-option" data-lang="fr" lang="fr" aria-label="Français" aria-pressed="false">FR</button>
        </div>
      </div>

      <p class="eyebrow" id="card-title">A little something for you</p>

      <!-- The compliment. The emoji is decorative (hidden from screen readers);
           aria-live makes screen readers read each new compliment aloud. -->
      <figure class="compliment" id="compliment-box">
        <span class="compliment-emoji" id="compliment-emoji" aria-hidden="true">🌟</span>
        <blockquote class="compliment-text" id="compliment" aria-live="polite">
          You make the world a little brighter just by being in it.
        </blockquote>
      </figure>
    </section>

    <!-- The buttons, below the card -->
    <div class="actions">
      <button type="button" class="button" id="new-compliment">Get a New Compliment</button>
      <button type="button" class="button button-joke" id="new-joke">Tell Me a Joke</button>
    </div>

    <button type="button" class="button-secondary" id="open-favorites" aria-haspopup="dialog" aria-controls="favorites-dialog">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <path d="M12 20.5s-7.5-4.6-9.3-9.2C1.4 8 3.6 4.5 7.1 4.5c2 0 3.6 1.1 4.9 2.8 1.3-1.7 2.9-2.8 4.9-2.8 3.5 0 5.7 3.5 4.4 6.8-1.8 4.6-9.3 9.2-9.3 9.2Z" />
      </svg>
      <span id="open-favorites-label">My favorites</span>
      <span class="count" id="favorites-count">0</span>
    </button>
  </main>

  <!-- Favorites list -->
  <dialog class="favorites" id="favorites-dialog" aria-labelledby="favorites-title">
    <div class="favorites-head">
      <h2 id="favorites-title">My favorites</h2>
      <button type="button" class="icon-button" id="favorites-close" aria-label="Close">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" /></svg>
      </button>
    </div>
    <p class="favorites-empty" id="favorites-empty">No favorites yet.</p>
    <ul class="favorites-list" id="favorites-list"></ul>
    <p class="favorites-note" id="favorites-note" hidden></p>
    <div class="favorites-foot">
      <button type="button" class="button-secondary button-danger" id="favorites-clear">Clear all</button>
    </div>
  </dialog>

  <!-- Short announcements for screen readers ("Added to favorites"…) -->
  <p class="sr-only" id="status" aria-live="polite"></p>

  <!-- Script is loaded last so the elements above already exist when it runs -->
  <script src="js/script.js"></script>
</body>
</html>
