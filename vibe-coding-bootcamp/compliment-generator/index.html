<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Compliment Generator</title>
  <meta name="description" content="A little dose of kindness: get a random compliment with one click." />

  <!-- Tab icon -->
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png" />

  <!-- Google Fonts: Nunito for the compliment, Lato for the button and UI text -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Nunito:wght@600;800&display=swap" rel="stylesheet" />

  <!-- Styles -->
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="page">
    <!-- The card that holds the compliment and the button -->
    <section class="card" aria-labelledby="card-title">
      <!-- Language switch. Each option is written in its own language so it's
           recognisable whatever language the page is in. -->
      <div class="lang-switch" role="group" aria-label="Language" id="lang-switch">
        <button type="button" class="lang-option" data-lang="en" lang="en" aria-label="English" aria-pressed="true">EN</button>
        <button type="button" class="lang-option" data-lang="fr" lang="fr" aria-label="Français" aria-pressed="false">FR</button>
      </div>

      <p class="eyebrow" id="card-title">A little something for you</p>

      <!-- The compliment. The emoji is decorative (hidden from screen readers);
           aria-live makes screen readers read each new compliment aloud. -->
      <figure class="compliment" id="compliment-box">
        <span class="compliment-emoji" id="compliment-emoji" aria-hidden="true">🌟</span>
        <blockquote class="compliment-text" id="compliment" aria-live="polite">
          You make the world a little brighter just by being in it.
        </blockquote>
      </figure>

      <button type="button" class="button" id="new-compliment">
        Get a New Compliment
      </button>
    </section>
  </main>

  <!-- Script is loaded last so the elements above already exist when it runs -->
  <script src="js/script.js"></script>
</body>
</html>
